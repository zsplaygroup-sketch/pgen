name: PGEN SD CEARA - build experimental
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PGEN
        shell: bash
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Upload ELF and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PGEN-SD-CEARA-resultado
          path: |
            dist/*.ELF
            ps2/*.elf
          if-no-files-found: warn
