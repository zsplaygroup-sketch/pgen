
name: PGEN SD CEARA - build experimental

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sd-ceara-experimental

      - name: Install build dependencies
        run: apk add --no-cache bash python3 make

      - name: Diagnose PS2 toolchain
        shell: sh
        run: |
          echo "PS2DEV=$PS2DEV"
          echo "PS2SDK=$PS2SDK"
          ls -la /usr/local/ps2dev/ee/bin || true
          command -v ee-g++ || true
          command -v mips64r5900el-ps2-elf-g++ || true

      - name: Build PGEN
        shell: bash
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload ELF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PGEN-SD-CEARA-resultado
          path: dist/*.ELF
          if-no-files-found: warn
